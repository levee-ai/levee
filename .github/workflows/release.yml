name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Scoped to this job, not the workflow. contents creates the Release,
      # packages pushes to ghcr.io.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser derives the release changelog by walking back to the previous
          # tag, which a shallow clone does not contain.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # A tag can point at a commit CI never ran on, and a publish cannot be undone.
      - name: Run tests before publishing anything
        run: go test -race -count=1 ./...

      # qemu because the linux/arm64 image is built on an amd64 runner, buildx
      # because .goreleaser.yaml sets use: buildx on both image entries.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Published notes come from the curated CHANGELOG section, not from a commit
      # scan. goreleaser filters commits by conventional-commit prefix, but this
      # repository squash-merges and a squash subject is the pull request title,
      # which usually carries no prefix, so CI and docs work leaks into the notes.
      - name: Extract the release notes for this tag
        run: |
          version="$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]
          then
            echo "tag $GITHUB_REF_NAME does not match the top CHANGELOG section [$version]"
            echo "add the section for this version before tagging"
            exit 1
          fi
          awk '/^## \[/{n++; if (n==1) next} n==1' CHANGELOG.md > release-notes.md
          # Test for non-whitespace, not for size. A section holding only a blank
          # line is one byte, which passes -s and would publish empty notes.
          if ! grep -q "[^[:space:]]" release-notes.md
          then
            echo "extracted release notes have no content"
            exit 1
          fi
          echo "release notes for $version:"
          cat release-notes.md

      - uses: goreleaser/goreleaser-action@v6
        with:
          # Pinned so the release cannot change under an upstream release.
          version: "2.18.2"
          # --release-notes replaces the generated changelog. The changelog block in
          # .goreleaser.yaml stays as the fallback for any run without this flag.
          args: release --clean --release-notes=release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
